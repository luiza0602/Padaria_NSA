<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Padaria NSA</title>

    <!-- css -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/autentificacao.css">

    <!-- icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

</head>

<body class="auth-body">

    <div class="auth-box">

        <!-- lado logo -->
        <div class="auth-lado">
            <img src="assets/img/logo.png" alt="Logo Padaria NSA">
        </div>

        <!-- form -->
        <div class="auth-conteudo">

            <h1>Crie Sua Conta</h1>
            <p class="auth-subtitulo">Preencha os dados abaixo para se cadastrar</p>

            <form class="auth-form" id="form-cadastro" action="cadastro.php" method="POST">

                <div class="campo">
                    <label for="cad-email">E-mail</label>
                    <div class="input-icone">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="cad-email" name="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="auth-linha">

                    <div class="campo">
                        <label for="cad-senha">Senha</label>
                        <div class="input-icone">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="cad-senha" name="senha" placeholder="Mínimo de 6 dígitos"
                                minlength="6" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="cad-confirma-senha">Confirme a Senha</label>
                        <div class="input-icone">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="cad-confirma-senha" name="confirma_senha"
                                placeholder="Digite novamente" minlength="6" required>
                        </div>
                    </div>

                </div>

                <div class="campo">
                    <label for="cad-telefone">Telefone</label>
                    <div class="input-icone">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="cad-telefone" name="telefone" placeholder="(xx) xxxxx-xxxx" required>
                    </div>
                </div>

                <div class="auth-termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">
                        Li e concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de
                            Privacidade</a>
                    </label>
                </div>

                <button type="submit" class="btn-auth">Criar conta</button>

                <div class="auth-divisor">ou continue com</div>

                <div class="auth-social">
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-google"></i> Google
                    </button>
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-facebook"></i> Facebook
                    </button>
                </div>

                <p class="auth-rodape">
                    Já tem uma conta? <a href="login.html">Faça Login</a>
                </p>

                <a href="index.html" class="auth-voltar">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para a página inicial
                </a>

            </form>

        </div>

    </div>

    <script src="assets/js/auth.js"></script>

</body>

</html>
